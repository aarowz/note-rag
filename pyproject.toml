[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "note-rag"
version = "0.1.0"
description = "Local CLI RAG over Markdown: index notes, retrieve chunks, answer with Ollama + citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
note-rag = "note_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/note_rag"]

[tool.hatch.build.targets.sdist]
include = ["src/note_rag", "tests", "corpus", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
